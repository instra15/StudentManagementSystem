spring.application.name=StudentManagementSystem

#数据库配置信息
spring.datasource.url = jdbc:mysql://localhost:3306/student_management?characterEncoding=UTF-8
spring.datasource.username = root
spring.datasource.password=${DATABASE_PASSWORD}

#日志功能配置信息
logging.file.name=logs/student-system.log
logging.file.max-size=10MB
logging.file.max-history=7

#接口文档配置信息
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.studentmanagementsystem.controller